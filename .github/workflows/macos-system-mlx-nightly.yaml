# Nightly compatibility check against the current Homebrew MLX formula.

name: macOS System MLX Nightly

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  macos-system:
    runs-on: macos-14

    name: macOS System MLX (Homebrew)

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true

      - name: Install system dependencies and MLX
        run: |
          brew update
          brew install cmake mlx
          cmake --version
          brew info mlx
          grep "MLX_VERSION" /opt/homebrew/include/mlx/version.h || true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - name: Build and install package (system MLX)
        env:
          MLX_USE_SYSTEM: "1"
        run: |
          chmod +x configure cleanup
          R CMD build .
          R CMD INSTALL *.tar.gz
        shell: bash

      - name: Verify installation
        run: |
          Rscript -e "library(Rmlx); print('Package loaded successfully')"
          Rscript -e "library(Rmlx); x <- as_mlx(1:10); print(x)"

      - name: Run simple operation
        run: |
          Rscript -e "library(Rmlx); A <- as_mlx(matrix(1:12, 3, 4)); B <- as_mlx(matrix(1:12, 4, 3)); C <- A %*% B; print(as.matrix(C))"
